  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#02060a; --bg2:#06101c; --bg3:#0c1828;
    --fg:#c8d8e8; --dim:#5a7288; --dim2:#2a3644;
    --o2:#7ce0a8; --co2:#ffcc44; --h2o:#5fc8ff; --atom:#b388ff;
    --mana:#ff66c8; --aura:#ffd93d; --zen:#8cf0d0;
    --patch:#ff8844; --dispatch:#88aaff;
    --red:#ff5a7a; --ok:#7ce0a8; --warn:#ffcc44; --err:#ff5a7a;
    --line:rgba(120,200,180,0.10);
    --line2:rgba(120,200,180,0.05);
    --mono:'Consolas','Courier New',monospace;
    --serif:'Yu Mincho','Hiragino Mincho ProN',serif;
  }
  html,body{height:100%;overflow:hidden;}
  body{background:#000;color:var(--fg);font-family:var(--mono);font-size:12px;}

  #desk{
    width:100vw;height:100vh;background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
  }
  #desk::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 40%,
      rgba(124,224,168,0.05) 0%, rgba(95,200,255,0.02) 40%, transparent 70%);
    animation:bgBreathe 8s ease-in-out infinite;
    pointer-events:none;z-index:0;
  }
  @keyframes bgBreathe{
    0%,100%{transform:scale(1);opacity:.5;}
    50%{transform:scale(1.06);opacity:1;}
  }

  #topbar{
    height:32px;background:linear-gradient(180deg,#06101c,#02060a);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 14px;
    font-size:11px;letter-spacing:1px;gap:10px;
    flex-shrink:0;position:relative;z-index:2;
  }
  #topbar .logo{
    color:var(--o2);font-weight:bold;letter-spacing:3px;
    font-family:var(--serif);display:flex;align-items:center;gap:8px;
  }
  #topbar .logo b{color:var(--co2);}
  #topbar .breath{
    display:inline-block;width:10px;height:10px;border-radius:50%;
    background:var(--o2);box-shadow:0 0 10px var(--o2);
    animation:breathPulse 4s ease-in-out infinite;
  }
  @keyframes breathPulse{
    0%,100%{transform:scale(.85);box-shadow:0 0 8px var(--o2);}
    50%{transform:scale(1.3);box-shadow:0 0 20px var(--o2),0 0 40px rgba(124,224,168,.4);}
  }
  #topbar .sep{width:1px;height:16px;background:var(--line);}
  #topbar .stat{
    color:var(--dim);font-size:10px;
    display:flex;gap:12px;margin-left:auto;align-items:center;flex-wrap:wrap;
  }
  #topbar .stat b{font-weight:bold;}
  #topbar .stat b.o2{color:var(--o2);}
  #topbar .stat b.co2{color:var(--co2);}
  #topbar .stat b.h2o{color:var(--h2o);}
  #topbar .stat b.atom{color:var(--atom);}
  #topbar .stat b.mana{color:var(--mana);}
  #topbar .stat b.aura{color:var(--aura);}
  #topbar .stat b.zen{color:var(--zen);}
  #topbar .stat b.ok{color:var(--ok);}
  #topbar .stat b.warn{color:var(--warn);}
  #topbar .stat b.err{color:var(--err);}
  #topbar #clock{color:var(--h2o);}

  #main{
    flex:1;display:grid;
    grid-template-columns:300px 1fr 300px;
    overflow:hidden;min-height:0;position:relative;z-index:1;
  }
  @media(max-width:1200px){#main{grid-template-columns:1fr 1fr;}}
  @media(max-width:820px){#main{grid-template-columns:1fr;}}

  .col{display:flex;flex-direction:column;overflow-y:auto;min-height:0;}
  .col::-webkit-scrollbar{width:6px;}
  .col::-webkit-scrollbar-thumb{background:var(--line);}

  .panel{
    background:var(--bg2);border:1px solid var(--line);
    border-radius:6px;padding:10px 12px;margin:8px 8px 0 8px;
    position:relative;overflow:hidden;
  }
  .panel:last-child{margin-bottom:8px;}
  .panel h3{
    font-size:10px;letter-spacing:1.8px;color:var(--o2);
    text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;
    border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--serif);font-weight:normal;
  }
  .panel h3 .badge{
    font-size:9px;color:var(--o2);background:rgba(124,224,168,0.08);
    padding:1px 7px;border-radius:3px;letter-spacing:0.5px;
    font-family:var(--mono);font-weight:bold;transition:.3s;
  }
  .panel h3 .badge.ok{color:var(--ok);background:rgba(124,224,168,0.15);}
  .panel h3 .badge.warn{color:var(--warn);background:rgba(255,204,68,0.12);}
  .panel h3 .badge.err{color:var(--err);background:rgba(255,90,122,0.12);}
  .panel h3 .badge.h2o{color:var(--h2o);background:rgba(95,200,255,0.12);}
  .panel h3 .badge.atom{color:var(--atom);background:rgba(179,136,255,0.12);}
  .panel h3 .badge.mana{color:var(--mana);background:rgba(255,102,200,0.12);}

  .flash{animation:flashPanel .4s ease-out;}
  @keyframes flashPanel{
    0%{box-shadow:inset 0 0 0 rgba(124,224,168,0);}
    50%{box-shadow:inset 0 0 40px rgba(124,224,168,0.3);}
    100%{box-shadow:inset 0 0 0 rgba(124,224,168,0);}
  }

  .kern-row{
    display:grid;grid-template-columns:90px 1fr 55px;
    gap:8px;align-items:center;padding:5px 0;
    border-bottom:1px dashed var(--line2);font-size:10.5px;
  }
  .kern-row:last-child{border-bottom:none;}
  .kern-row .k{color:var(--dim);font-size:9.5px;letter-spacing:1px;font-weight:bold;}
  .kern-row .bar{height:6px;background:var(--bg3);border-radius:2px;overflow:hidden;}
  .kern-row .bar .f{height:100%;transition:width .4s cubic-bezier(.2,.9,.25,1);}
  .kern-row .bar .f.dispatch{background:linear-gradient(90deg,#2a3a5a,var(--dispatch));}
