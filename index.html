<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inBOOT · Shepherding · Schwarm · Cluster · Loop</title>
  <style>
    html,body{margin:0;height:100%;background:#02060a;overflow:hidden;font-family:monospace;color:#7ce0a8}
    canvas{display:block;width:100vw;height:100vh}
    #info{position:fixed;top:10px;left:10px;background:rgba(2,6,10,0.8);border:1px solid #1a3a2a;padding:8px 12px;border-radius:4px;font-size:11px;line-height:1.6;pointer-events:none}
    #info b{color:#ffcc44}
    #info .mode{color:#5fc8ff}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  <div>Modus: <span class="mode" id="mode">driving</span></div>
  <div>Cluster: <b id="clusters">–</b></div>
  <div>Streuung: <b id="spread">–</b></div>
  <div>Frame: <b id="frame">0</b></div>
  <div>Runs: <b id="runs">0</b></div>
  <div>Erfolge: <b id="successes">0</b></div>
  <div>Erfolgsrate: <b id="successRate">–</b></div>
  <div>Ø Zeit: <b id="avgTime">–</b></div>
</div>
<script>
// ============================================================
// inBOOT · Shepherding · Schwarm · Cluster · Loop
// Minimal: Arrays statt Objekte, Canvas, autonom, self-contained
// Shepherding nach Strömbom (Driving/Collecting), messbare Parameter
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---------- Konfiguration ----------
const N = 20;
const SHEPHERD_SPEED = 2.2;
const AGENT_SPEED = 1.2;
const SEPARATION_DIST = 30;
const SHEPHERD_INFLUENCE = 60; // Abstand, ab dem Schäfer Agenten abstößt
const CLUSTER_DIST = 40;
const COLLECT_THRESHOLD = 80;  // maxDist > -> collecting
const DRIVE_THRESHOLD = 50;    // maxDist < -> driving (Hysterese)
const CLUSTER_INTERVAL = 10;
const GOAL_RADIUS = 60;
const GOAL_PERCENT = 0.8;      // 80% der Agenten im Zielradius

// ---------- Zustand ----------
let x = new Array(N), y = new Array(N);
let vx = new Array(N), vy = new Array(N);
let sx, sy;
let tx, ty;
let mode = 'driving';
let frame = 0;
let clusterCount = 0;
let spread = 0;
let maxDist = 0;

// Messung
let runs = 0;
let successes = 0;
let totalTime = 0;
let runStartFrame = 0;
let goalReached = false;

// ---------- Initialisierung ----------
function init() {
  // Ziel in der Mitte
  tx = W / 2;
  ty = H / 2;
  // Schäfer etwas daneben
  sx = tx + 200;
  sy = ty;
  // Agenten zufällig um Ziel verteilen
  for (let i = 0; i < N; i++) {
    const ang = Math.random() * Math.PI * 2;
    const r = 100 + Math.random() * 150;
    x[i] = tx + Math.cos(ang) * r;
    y[i] = ty + Math.sin(ang) * r;
    vx[i] = (Math.random() - 0.5) * 0.5;
    vy[i] = (Math.random() - 0.5) * 0.5;
  }
  mode = 'driving';
  goalReached = false;
  // frame bleibt global, runStartFrame wird nach init gesetzt
}

// ---------- Update ----------
function update() {
  // 1) Zentroid und maxDist berechnen
  let cx = 0, cy = 0;
  for (let i = 0; i < N; i++) { cx += x[i]; cy += y[i]; }
  cx /= N; cy /= N;
  maxDist = 0;
  let farIdx = 0;
  for (let i = 0; i < N; i++) {
    const d = Math.hypot(x[i] - cx, y[i] - cy);
    if (d > maxDist) { maxDist = d; farIdx = i; }
  }

  // 2) Modus mit Hysterese
  if (maxDist > COLLECT_THRESHOLD) {
    mode = 'collecting';
  } else if (maxDist < DRIVE_THRESHOLD) {
    mode = 'driving';
  }

  // 3) Schäfer bewegen
  if (mode === 'collecting') {
    // zum entferntesten Agenten
    const dx = x[farIdx] - sx, dy = y[farIdx] - sy;
    const d = Math.hypot(dx, dy) || 1;
    sx += (dx / d) * SHEPHERD_SPEED;
    sy += (dy / d) * SHEPHERD_SPEED;
  } else {
    // driving: Schäfer positioniert sich hinter der Herde relativ zum Ziel
    let dx = cx - tx, dy = cy - ty;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const targetSx = cx + dx * 40;
    const targetSy = cy + dy * 40;
    const dxS = targetSx - sx, dyS = targetSy - sy;
    const dS = Math.hypot(dxS, dyS) || 1;
    sx += (dxS / dS) * SHEPHERD_SPEED;
    sy += (dyS / dS) * SHEPHERD_SPEED;
  }

  // 4) Agenten bewegen
  for (let i = 0; i < N; i++) {
    let ax = 0, ay = 0;

    // Kohäsion: zum Zentroid
    const dxc = cx - x[i], dyc = cy - y[i];
    const dc = Math.hypot(dxc, dyc) || 1;
    ax += (dxc / dc) * 0.02;
    ay += (dyc / dc) * 0.02;

    // Separation
    for (let j = 0; j < N; j++) {
      if (i === j) continue;
      const dx = x[i] - x[j], dy = y[i] - y[j];
      const d = Math.hypot(dx, dy) || 1;
      if (d < SEPARATION_DIST) {
        ax += (dx / d) * 0.05;
        ay += (dy / d) * 0.05;
      }
    }

    // Abstoßung vom Schäfer
    const dxs = x[i] - sx, dys = y[i] - sy;
    const ds = Math.hypot(dxs, dys) || 1;
    if (ds < SHEPHERD_INFLUENCE) {
      const force = (SHEPHERD_INFLUENCE - ds) * 0.005;
      ax += (dxs / ds) * force;
      ay += (dys / ds) * force;
    }

    // Geschwindigkeit aktualisieren
    vx[i] += ax;
    vy[i] += ay;
    const v = Math.hypot(vx[i], vy[i]) || 1;
    vx[i] = (vx[i] / v) * AGENT_SPEED;
    vy[i] = (vy[i] / v) * AGENT_SPEED;

    // Position
    x[i] += vx[i];
    y[i] += vy[i];

    // Ränder
    if (x[i] < 0) { x[i] = 0; vx[i] *= -0.5; }
    if (x[i] > W) { x[i] = W; vx[i] *= -0.5; }
    if (y[i] < 0) { y[i] = 0; vy[i] *= -0.5; }
    if (y[i] > H) { y[i] = H; vy[i] *= -0.5; }
  }

  // 5) Clustering/Pool nur alle 10 Frames
  if (frame % CLUSTER_INTERVAL === 0) {
    let sum = 0;
    for (let i = 0; i < N; i++) {
      sum += Math.hypot(x[i] - cx, y[i] - cy);
    }
    spread = sum / N;
    clusterCount = Math.max(1, Math.round(maxDist / CLUSTER_DIST));
  }

  // 6) Zielprüfung
  if (!goalReached) {
    let inGoal = 0;
    for (let i = 0; i < N; i++) {
      if (Math.hypot(x[i] - tx, y[i] - ty) < GOAL_RADIUS) inGoal++;
    }
    if (inGoal >= N * GOAL_PERCENT) {
      goalReached = true;
      successes++;
      totalTime += frame - runStartFrame;
      runs++;
      init();
      runStartFrame = frame; // neuer Lauf startet jetzt
    }
  }
}

// ---------- Zeichnen ----------
function draw() {
  ctx.fillStyle = '#02060a';
  ctx.fillRect(0, 0, W, H);

  // Zielradius
  ctx.beginPath();
  ctx.arc(tx, ty, GOAL_RADIUS, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,204,68,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Ziel
  ctx.beginPath();
  ctx.arc(tx, ty, 12, 0, Math.PI * 2);
  ctx.strokeStyle = '#ffcc44';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,204,68,0.15)';
  ctx.fill();

  // Schäfer
  ctx.beginPath();
  ctx.arc(sx, sy, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#5fc8ff';
  ctx.shadowColor = '#5fc8ff';
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Agenten + Linien
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      const d = Math.hypot(x[i] - x[j], y[i] - y[j]);
      if (d < SEPARATION_DIST) {
        ctx.beginPath();
        ctx.moveTo(x[i], y[i]);
        ctx.lineTo(x[j], y[j]);
        ctx.strokeStyle = 'rgba(124,224,168,0.12)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }
    ctx.beginPath();
    ctx.arc(x[i], y[i], 3.5, 0, Math.PI * 2);
    ctx.fillStyle = mode === 'driving' ? '#7ce0a8' : '#ff66c8';
    ctx.fill();
  }

  // Info aktualisieren
  document.getElementById('mode').textContent = mode;
  document.getElementById('clusters').textContent = clusterCount;
  document.getElementById('spread').textContent = spread.toFixed(1);
  document.getElementById('frame').textContent = frame;
  document.getElementById('runs').textContent = runs;
  document.getElementById('successes').textContent = successes;
  const rate = runs > 0 ? (successes / runs * 100).toFixed(1) + '%' : '–';
  document.getElementById('successRate').textContent = rate;
  const avg = successes > 0 ? (totalTime / successes).toFixed(1) : '–';
  document.getElementById('avgTime').textContent = avg;
}

// ---------- Loop ----------
function loop() {
  frame++;
  update();
  draw();
  requestAnimationFrame(loop);
}

// ---------- Start ----------
init();
runStartFrame = frame;
loop();
</script>
</body>
</html>
